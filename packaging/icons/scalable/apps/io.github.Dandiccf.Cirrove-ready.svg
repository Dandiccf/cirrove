<?xml version="1.0" encoding="UTF-8"?>
<!-- Colored tray icon, not symbolic: hosts that do not recolor (Quickshell,
     KDE) draw it as-is and it reads on any panel, dark or light. Ready: the
     calm blue cloud, matching the launcher icon. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62c6ff"/>
      <stop offset="1" stop-color="#1e6fd9"/>
    </linearGradient>
  </defs>
  <path d="M 4.3,13 H 11.6 A 3,3 0 0 0 12,6.9 A 4,4 0 0 0 4.5,6.05 A 3.4,3.4 0 0 0 4.3,13 Z" fill="url(#sky)"/>
  <rect x="5.6" y="9.1" width="5.2" height="1.9" rx="0.9" fill="#ffffff" opacity="0.92"/>
  <circle cx="9.8" cy="10.05" r="0.5" fill="#1e6fd9"/>
</svg>
