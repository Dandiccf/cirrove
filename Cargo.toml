[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/Dandiccf/cirrove"

[workspace.dependencies]
cirrove-core = { path = "crates/cirrove-core" }
cirrove-store = { path = "crates/cirrove-store" }
cirrove-onedrive = { path = "crates/cirrove-onedrive" }
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
httpdate = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
