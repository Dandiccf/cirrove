[workspace]
members = ["crates/*"]
# A plain root build needs no desktop toolchain. Contributor/CI checks use --workspace.
default-members = [
    "crates/cirrove-auth",
    "crates/cirrove-core",
    "crates/cirrove-onedrive",
    "crates/cirrove-service",
    "crates/cirrove-store",
]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/Dandiccf/cirrove"

[workspace.dependencies]
cirrove-core = { path = "crates/cirrove-core" }
cirrove-store = { path = "crates/cirrove-store" }
cirrove-onedrive = { path = "crates/cirrove-onedrive" }
cirrove-auth = { path = "crates/cirrove-auth" }
cirrove-service = { path = "crates/cirrove-service" }
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
httpdate = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
chrono = "0.4"
openidconnect = { version = "4.0", default-features = false }
secret-service = { version = "5.2", features = ["rt-tokio-crypto-rust"] }
base64 = "0.23"
sha2 = "0.11"
hex = "0.4"
subtle = "2.6"
uuid = { version = "1.18", features = ["v4", "serde"] }
url = "2.5"
fs2 = "0.4"
fuser = { version = "0.18", default-features = false }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "form", "query"] }
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time", "sync", "fs", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
