name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config fuse3 libgtk-4-dev libadwaita-1-dev xvfb desktop-file-utils
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Package-specific feature resolution can rebuild dependencies. Keep that
      # compilation outside the native window's unchanged runtime deadline.
      - name: Build native desktop test
        run: cargo test -p cirrove-desktop --test window --locked --no-run
      - name: Native desktop with isolated account settings and status service
        run: timeout 30s xvfb-run -a dbus-run-session -- cargo test -p cirrove-desktop --test window --locked -- --ignored --test-threads=1
      - run: desktop-file-validate packaging/desktop/io.github.Dandiccf.Cirrove.desktop
      - name: Verify kernel FUSE access
        run: |
          test -c /dev/fuse || sudo modprobe fuse
          test -r /dev/fuse && test -w /dev/fuse
          mountpoint -q /sys/fs/fuse/connections || sudo mount -t fusectl fusectl /sys/fs/fuse/connections
      - name: Build kernel fixtures
        run: cargo test -p cirrove-service --lib --test read_only --test writable_session --locked --no-run
      - name: Filesystem, isolated local writes and mount lifecycle
        # Keep independent mounts from competing with latency/memory fixtures.
        # Each fixture still exercises its own concurrent requests/accounts.
        run: timeout 150s cargo test -p cirrove-service --test read_only --locked real_ -- --ignored --nocapture --test-threads=1
      - name: Namespace reclamation, deep-alias churn and held file versions
        run: timeout 150s cargo test -p cirrove-service --lib --locked filesystem::capacity::real_ -- --ignored --nocapture --test-threads=1
      - name: Streamed windows, concurrent kernel readers and navigation
        run: timeout 90s cargo test -p cirrove-service --lib --locked content::windows::tests::graph::kernel::real_ -- --ignored --nocapture --test-threads=1
      - name: Automatic writable-session uploads and draining
        run: timeout 90s cargo test -p cirrove-service --test writable_session --locked real_ -- --ignored --nocapture
      - run: cargo build --workspace --locked
      - run: python3 scripts/smoke.py
      - run: python3 scripts/test-observe-service.py
      - run: cargo doc --workspace --no-deps --locked
  mounted-read-workloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install service build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config fuse3
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build optimized workload fixtures
        run: cargo test -p cirrove-service --lib --locked --release --no-run
      - name: Verify kernel FUSE access
        run: |
          test -c /dev/fuse || sudo modprobe fuse
          test -r /dev/fuse && test -w /dev/fuse
          mountpoint -q /sys/fs/fuse/connections || sudo mount -t fusectl fusectl /sys/fs/fuse/connections
      - name: Mounted file workloads with and without simulated response latency
        # A separate process for each variant avoids allocator high-water marks
        # from an earlier variant contaminating the next memory measurement.
        run: |
          for delay in 0 20; do
            for mode in conservative strong windows; do
              CIRROVE_FIXTURE_REQUEST_DELAY_MS="$delay" timeout 210s cargo test -p cirrove-service --lib --locked --release "real_mounted_${mode}_read_workload" -- --ignored --nocapture --test-threads=1
            done
          done
