name: CI
on:
  # `push` with no branch filter ran this workflow twice on every commit in a
  # pull request: once for the push and once for the pull_request event, on the
  # same SHA. The concurrency group below does not collapse them, because
  # github.ref differs between the two -- refs/heads/<branch> against
  # refs/pull/<n>/merge -- so neither cancels the other.
  #
  # That doubled the queue on a shared runner, and worse: both runs report under
  # the same check name, so branch protection waited for the slower duplicate
  # before a green pull request could merge. Pushes to main still run, which is
  # what covers a merge commit; a branch's own commits are covered by the
  # pull_request event.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config fuse3 libgtk-4-dev libadwaita-1-dev xvfb x11-utils desktop-file-utils gnome-keyring appstream
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Credential round trip against a throwaway Secret Service
        # The vault has one integration test and nothing ran it: dbus-run-session
        # was already here for the desktop step, but a session bus is not a Secret
        # Service. gnome-keyring-daemon supplies one, unlocked with a password
        # that exists only inside this job's session. The test writes and deletes
        # a uniquely named synthetic entry and touches nothing else.
        run: |
          timeout 120s dbus-run-session -- sh -c '
            echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1 &
            sleep 2
            cargo test -p cirrove-auth --test desktop_vault --locked -- --ignored --nocapture
          '
      - name: Every ignored test is either run by CI or excused by name
        run: python3 scripts/ci-coverage.py
      - name: No acceptance box is ticked without a test asserting it
        run: python3 scripts/acceptance-ledger.py
      - run: cargo test --workspace --locked
      # Package-specific feature resolution can rebuild dependencies. Keep that
      # compilation outside the native window's unchanged runtime deadline.
      - name: Build native desktop test
        run: cargo test -p cirrove-desktop --test window --locked --no-run
      - name: Native desktop with isolated account settings and status service
        run: timeout 30s xvfb-run -a dbus-run-session -- cargo test -p cirrove-desktop --test window --locked -- --ignored --test-threads=1
      # The tray registered with a watcher, answered every property it declared,
      # and drew nothing, because the set was incomplete and a host reads the
      # whole of it. No unit test could see that; this one asks over a bus.
      - name: Build tray item test
        run: cargo test -p cirrove-desktop --test tray --locked --no-run
      - name: Tray item offers a host every property it reads
        run: timeout 30s dbus-run-session -- cargo test -p cirrove-desktop --test tray --locked -- --ignored --test-threads=1
      - run: desktop-file-validate packaging/desktop/io.github.Dandiccf.Cirrove.desktop
      # One application identity: both entries, the AppStream metainfo, and the
      # test below that ties them to the app id the window and tray register.
      - name: Desktop entries and AppStream metainfo are valid
        run: |
          desktop-file-validate packaging/desktop/io.github.Dandiccf.Cirrove.desktop
          desktop-file-validate packaging/desktop/io.github.Dandiccf.Cirrove.Tray.desktop
          appstreamcli validate packaging/metainfo/io.github.Dandiccf.Cirrove.metainfo.xml
      # The autostart entry and the tray unit have to agree with each other and
      # stay free of any desktop they would have to guess at packaging time.
      - name: Tray autostart entry and unit
        run: cargo test -p cirrove-desktop --test packaging --locked
      - name: Verify kernel FUSE access
        run: |
          test -c /dev/fuse || sudo modprobe fuse
          test -r /dev/fuse && test -w /dev/fuse
          mountpoint -q /sys/fs/fuse/connections || sudo mount -t fusectl fusectl /sys/fs/fuse/connections
      - name: Build kernel fixtures
        run: cargo test -p cirrove-service --lib --test read_only --test writable_session --test google_drive --locked --no-run
      - name: Filesystem, isolated local writes and mount lifecycle
        # real_reclamation_reaches_a_mount_that_only_reads needs a floor this
        # fixture can reach: it retains a flat 16.5 MiB however much it reads,
        # while the shipped floor is 64 MiB derived from a daemon holding
        # 184,000 nodes. The other tests in this step do not read the variable.
        env:
          CIRROVE_RECLAIM_FLOOR_BYTES: "8388608"
          CIRROVE_RECLAIM_INTERVAL_SECONDS: "1"
        # Keep independent mounts from competing with latency/memory fixtures.
        # Each fixture still exercises its own concurrent requests/accounts.
        run: timeout 150s cargo test -p cirrove-service --test read_only --locked real_ -- --ignored --nocapture --test-threads=1
      - name: Google Drive through the shared kernel mount (synthetic)
        run: timeout 60s cargo test -p cirrove-service --test google_drive --locked real_ -- --ignored --nocapture --test-threads=1
      - name: Namespace reclamation, deep-alias churn and held file versions
        run: timeout 150s cargo test -p cirrove-service --lib --locked filesystem::capacity::real_ -- --ignored --nocapture --test-threads=1 --skip real_writable_namespace_retires_and_stays_bounded
      - name: Streamed windows, concurrent kernel readers and navigation
        # Without the cap the RSS assertion measures glibc arena retention
        # rather than the service and fails about one run in seven. See
        # docs/benchmarks/rss-allocator-arenas.json; the fixture refuses to run
        # without it rather than measuring the wrong thing quietly.
        env:
          MALLOC_ARENA_MAX: "1"
        run: timeout 90s cargo test -p cirrove-service --lib --locked content::windows::tests::graph::kernel::real_ -- --ignored --nocapture --test-threads=1
      - name: Automatic writable-session uploads and draining
        # Serialized like its neighbours. This was the only kernel-FUSE step
        # running its mounts concurrently -- twenty-one of them on a two-core
        # runner -- and it produced a sealing failure that neither reproduces
        # locally standalone nor when the same group is run one at a time. The
        # budget matches the read-only step; serialized, the group takes 34 s
        # here.
        # The full-device test is skipped here and run by the loop-image step
        # below: this one supplies no filesystem for it to fill, and it refuses
        # rather than silently measuring the wrong device.
        run: timeout 150s cargo test -p cirrove-service --test writable_session --locked real_ -- --ignored --nocapture --test-threads=1 --skip real_a_save_on_a_full_device_is_reported_as_a_device_and_not_a_budget
      - name: A save on a filesystem with no free block
        # The test consumes every free block of the filesystem it is handed, so
        # it gets one of its own rather than the runner's disk: a loop-backed
        # ext4 with reserved blocks at zero, which is what lets a non-root user
        # reach the last block. Root is available here and was the reason this
        # evidence used to be a manual run.
        # See docs/benchmarks/full-disk-journal-errors.json.
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/full-disk.img"
          mount="$RUNNER_TEMP/full-disk"
          mkdir -p "$mount"
          truncate -s 64M "$image"
          mkfs.ext4 -q -F -m 0 "$image"
          sudo mount -o loop "$image" "$mount"
          sudo chown "$(id -u):$(id -g)" "$mount"
          trap 'sudo umount "$mount" || true' EXIT
          CIRROVE_FULL_DISK_DIR="$mount" timeout 120s cargo test -p cirrove-service --test working_files --locked a_genuinely_full_filesystem_explains_what_to_free -- --ignored --nocapture
          # The same device, now through a writable kernel mount. The journal
          # test drives the journal directly and the budget test drives a mount;
          # neither has ever put a mount on a physically full filesystem, which
          # is why the ledger recorded the device case as a mapping and not a
          # journey. Without the mapping an application gets EIO here, not
          # ENOSPC.
          rm -f "$mount"/ballast
          CIRROVE_FULL_DISK_DIR="$mount" timeout 120s cargo test -p cirrove-service --test writable_session --locked real_a_save_on_a_full_device_is_reported_as_a_device_and_not_a_budget -- --ignored --nocapture --test-threads=1
      - name: A journal on a device that starts refusing writes
        # The process-death half of the crash box is closed: all 31 runtime
        # durable transitions are crossed by a process that then dies. What is
        # left is faults below the process, which need dm-flakey and root --
        # available here, and already used for modprobe and mount.
        #
        # Three invocations because the test cannot run dmsetup and the shell
        # that can has to interleave with it. Unmount before touching the table:
        # `dmsetup suspend` flushes, which fails once ext4 has entered
        # emergency_ro, so the obvious order cannot work after a fault. And heal
        # by unmounting rather than remounting: `mount -o remount,rw` reports
        # success on an emergency_ro filesystem without clearing it, which is a
        # silent no-op.
        #
        # See docs/benchmarks/journal-under-io-faults.json. A true power cut
        # stays out of reach and is named there rather than substituted for.
        run: |
          set -euo pipefail
          sudo modprobe dm_flakey
          image="$RUNNER_TEMP/flaky.img"
          mount="$RUNNER_TEMP/flaky"
          sectors=262144
          mkdir -p "$mount"
          truncate -s 128M "$image"
          loop=$(sudo losetup --find --show "$image")
          table() { sudo dmsetup suspend cirrove-flaky; sudo dmsetup reload cirrove-flaky --table "$1"; sudo dmsetup resume cirrove-flaky; }
          sudo dmsetup create cirrove-flaky --table "0 $sectors flakey $loop 0 1 0"
          trap 'sudo umount "$mount" 2>/dev/null || true; sudo dmsetup remove cirrove-flaky 2>/dev/null || true; sudo losetup -d "$loop" 2>/dev/null || true' EXIT
          sudo mkfs.ext4 -q -F -m 0 /dev/mapper/cirrove-flaky
          sudo mount /dev/mapper/cirrove-flaky "$mount"
          sudo chown "$(id -u):$(id -g)" "$mount"
          only=a_journal_on_a_failing_device_refuses_without_losing_what_was_durable
          phase() { CIRROVE_FLAKY_DIR="$mount" CIRROVE_FLAKY_PHASE="$1" timeout 120s cargo test -p cirrove-service --test working_files --locked "$only" -- --ignored --nocapture --test-threads=1; }
          phase seed
          sync
          table "0 $sectors flakey $loop 0 0 1 1 error_writes"
          phase fault
          sudo umount "$mount" 2>/dev/null || sudo umount -l "$mount"
          table "0 $sectors flakey $loop 0 1 0"
          sudo e2fsck -p -f /dev/mapper/cirrove-flaky >/dev/null 2>&1 || true
          sudo mount /dev/mapper/cirrove-flaky "$mount"
          sudo chown "$(id -u):$(id -g)" "$mount"
          phase recover
          # A lying fsync: the write is acknowledged and discarded. The journal
          # catches it through a generation check that reads back what it wrote.
          # Torn writes are deliberately NOT here: corrupt_bio_byte hits ext4's
          # metadata as readily as the journal's data, so it says nothing about
          # the journal. See the artifact.
          phase seed
          sync
          table "0 $sectors flakey $loop 0 0 1 1 drop_writes"
          phase lie
          sudo umount "$mount" 2>/dev/null || sudo umount -l "$mount"
          table "0 $sectors flakey $loop 0 1 0"
          sudo e2fsck -p -f /dev/mapper/cirrove-flaky >/dev/null 2>&1 || true
          sudo mount /dev/mapper/cirrove-flaky "$mount"
          sudo chown "$(id -u):$(id -g)" "$mount"
          phase after_lie
      - run: cargo build --workspace --locked
      - run: python3 scripts/smoke.py
      - run: python3 scripts/test-observe-service.py
      - run: python3 scripts/test-install-tray-autostart.py
      - run: python3 scripts/test-install-scripts.py
      - name: The Files extension holds to what it promises, against a daemon that is only a socket
        run: python3 scripts/test-nautilus-extension.py
      - name: Nothing is reachable only through one file manager
        run: python3 scripts/test-file-manager-docs.py
      - name: Google release evidence and the unpublished OAuth site stay coherent
        run: |
          python3 scripts/check-oauth-site.py
          python3 scripts/google-release-gate.py
      - name: Every icon fills its own canvas, and every string can be translated
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick gettext
          # A skip here would read exactly like a pass, so insist the tools are
          # really present before trusting the result.
          command -v rsvg-convert
          command -v magick || command -v convert
          command -v xgettext
          python3 scripts/test-icon-geometry.py
          python3 scripts/test-translations.py
      - run: cargo doc --workspace --no-deps --locked
  mounted-read-workloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install service build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config fuse3
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      # Milestone 6: the daemon and CLI must build and run without GTK4 or
      # libadwaita on the machine. This job installs neither, and this step
      # asserts that rather than leaving it to the absence of a line above.
      - name: Daemon and CLI build with no desktop libraries present
        run: |
          ! dpkg -s libgtk-4-dev >/dev/null 2>&1 || { echo "libgtk-4-dev is installed; this job no longer proves a headless build"; exit 1; }
          ! dpkg -s libadwaita-1-dev >/dev/null 2>&1 || { echo "libadwaita-1-dev is installed; this job no longer proves a headless build"; exit 1; }
          cargo build --locked --release
          test -x target/release/cirroved && test -x target/release/cirrove
          ./target/release/cirrove --help >/dev/null
      - name: Build optimized workload fixtures
        run: cargo test -p cirrove-service --lib --locked --release --no-run
      - name: Verify kernel FUSE access
        run: |
          test -c /dev/fuse || sudo modprobe fuse
          test -r /dev/fuse && test -w /dev/fuse
          mountpoint -q /sys/fs/fuse/connections || sudo mount -t fusectl fusectl /sys/fs/fuse/connections
      - name: Mounted file workloads with and without simulated response latency
        # A separate process for each variant avoids allocator high-water marks
        # from an earlier variant contaminating the next memory measurement.
        run: |
          for delay in 0 20; do
            for mode in conservative strong windows; do
              MALLOC_ARENA_MAX=1 CIRROVE_FIXTURE_REQUEST_DELAY_MS="$delay" timeout 210s cargo test -p cirrove-service --lib --locked --release "real_mounted_${mode}_read_workload" -- --ignored --nocapture --test-threads=1
            done
          done

  # Milestone 6: the Arch packages, built the way a user's machine would build
  # them -- from the committed tree, as an unprivileged user, with the
  # distribution's rust -- then installed, run, and removed on a clean system.
  # A container is a clean build root, not a desktop: this shows the packages
  # are correct and install cleanly, not that a login starts the service.
  arch-package:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 50
    # Attestations, not a signature: the release procedure's option A. CI signs
    # each package as it builds it, through Sigstore and this workflow's own
    # OIDC identity, so there is no private key for anyone to hold, lose or
    # rotate -- and what it proves is stronger than a detached signature, which
    # says only that someone with the key made this. `contents` is repeated
    # because naming any permission at a job replaces the workflow's whole set.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Build tools, and the desktop libraries the desktop packages build against
        run: pacman -Syu --noconfirm --needed git rust cmake pkgconf gtk4 libadwaita fuse3 desktop-file-utils appstream qt6-base kio ki18n
      - uses: actions/checkout@v7
        with:
          # The package version carries the commit count.
          fetch-depth: 0
      - name: Dolphin plugins load and cover ordinary files and folders
        run: |
          cmake -S packaging/dolphin -B target/dolphin-ci -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          cmake --build target/dolphin-ci --parallel
          ctest --test-dir target/dolphin-ci --output-on-failure
      - name: Build all packages from HEAD as an unprivileged user
        env:
          CIRROVE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.CIRROVE_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            test -n "$CIRROVE_GOOGLE_DESKTOP_CLIENT_SECRET" || { echo 'missing Cirrove Google Desktop OAuth build input'; exit 1; }
          fi
          useradd -m builder
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder "$GITHUB_WORKSPACE"
          # --nocheck: the package's check() reruns the unit tests in release
          # mode, a second full compile that the linux job has already paid
          # for on this same commit. This job is for the build, the install
          # and the removal; a developer's scripts/build-arch-package.sh run
          # still checks.
          runuser -u builder -- scripts/build-arch-package.sh -- --nocheck
      # Attested before it is uploaded, so what a release publishes is the file
      # this workflow signed and not one that passed through anything after.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/arch/*.pkg.tar.zst
      # The packages are the artefact a release takes and a VM installs; every
      # push leaves a set to download.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-packages
          path: target/arch/*.pkg.tar.zst
          if-no-files-found: error
      - name: Install, run, validate what a desktop would read, and remove
        run: |
          pacman -U --noconfirm $(ls target/arch/*.pkg.tar.zst | grep -v -- '-debug-')
          cirrove --help >/dev/null
          cirroved --help >/dev/null
          grep -q '^ExecStart=/usr/bin/cirroved ' /usr/lib/systemd/user/cirroved.service
          desktop-file-validate /usr/share/applications/io.github.Dandiccf.Cirrove.desktop
          desktop-file-validate /etc/xdg/autostart/io.github.Dandiccf.Cirrove.Tray.desktop
          appstreamcli validate /usr/share/metainfo/io.github.Dandiccf.Cirrove.metainfo.xml
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.Dandiccf.Cirrove-attention.svg
          test -f /usr/share/nautilus-python/extensions/cirrove.py
          test -f /usr/lib/qt6/plugins/kf6/kfileitemaction/cirrovefileitemaction.so
          test -f /usr/lib/qt6/plugins/kf6/overlayicon/cirroveoverlayicon.so
          pacman -Rns --noconfirm cirrove-dolphin cirrove-desktop cirrove
          for f in /usr/bin/cirroved /usr/bin/cirrove /usr/bin/cirrove-tray /usr/lib/systemd/user/cirroved.service /etc/xdg/autostart/io.github.Dandiccf.Cirrove.Tray.desktop; do
            ! test -e "$f" || { echo "$f survived removal"; exit 1; }
          done

  # Milestone 6, the Debian half: the packages built on the distribution CI
  # already runs on, installed, run, validated and removed. Ubuntu 24.04 is
  # the declared floor (GTK 4.14, libadwaita 1.5); Debian stable is older
  # than that for the desktop package and is not claimed.
  deb-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Attestations, not a signature: the release procedure's option A. CI signs
    # each package as it builds it, through Sigstore and this workflow's own
    # OIDC identity, so there is no private key for anyone to hold, lose or
    # rotate -- and what it proves is stronger than a detached signature, which
    # says only that someone with the key made this. `contents` is repeated
    # because naming any permission at a job replaces the workflow's whole set.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The package version carries the commit count.
          fetch-depth: 0
      - name: Packaging tools, and the desktop libraries the desktop package builds against
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper dpkg-dev cmake pkg-config libgtk-4-dev libadwaita-1-dev fuse3 desktop-file-utils appstream
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build both packages from HEAD
        env:
          CIRROVE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.CIRROVE_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            test -n "$CIRROVE_GOOGLE_DESKTOP_CLIENT_SECRET" || { echo 'missing Cirrove Google Desktop OAuth build input'; exit 1; }
          fi
          scripts/build-deb-package.sh
      # The packages are the artefact a release takes and a VM installs; every
      # push leaves a set to download.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/deb/*.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-packages
          path: target/deb/*.deb
          if-no-files-found: error
      - name: Install, run, validate what a desktop would read, and remove
        run: |
          sudo apt-get install -y ./target/deb/cirrove_*.deb ./target/deb/cirrove-desktop_*.deb
          cirrove --help >/dev/null
          cirroved --help >/dev/null
          grep -q '^ExecStart=/usr/bin/cirroved ' /usr/lib/systemd/user/cirroved.service
          desktop-file-validate /usr/share/applications/io.github.Dandiccf.Cirrove.desktop
          desktop-file-validate /etc/xdg/autostart/io.github.Dandiccf.Cirrove.Tray.desktop
          appstreamcli validate /usr/share/metainfo/io.github.Dandiccf.Cirrove.metainfo.xml
          test -f /usr/share/nautilus-python/extensions/cirrove.py
          # purge, not remove: the tray's autostart entry lives under /etc and
          # dpkg treats it as a conffile, which `remove` keeps by policy. A
          # user who wants nothing left runs purge; the user guide says so.
          sudo apt-get purge -y cirrove-desktop cirrove
          for f in /usr/bin/cirroved /usr/bin/cirrove /usr/bin/cirrove-tray /usr/lib/systemd/user/cirroved.service /etc/xdg/autostart/io.github.Dandiccf.Cirrove.Tray.desktop; do
            ! test -e "$f" || { echo "$f survived removal"; exit 1; }
          done

  # Milestone 6, the Fedora half, in a container: built as root, which rpmbuild
  # allows, with a rustup toolchain because the crates need a newer rust than
  # the distribution ships. Installed, run, validated, removed.
  rpm-package:
    runs-on: ubuntu-24.04
    container: fedora:42
    timeout-minutes: 40
    # Attestations, not a signature: the release procedure's option A. CI signs
    # each package as it builds it, through Sigstore and this workflow's own
    # OIDC identity, so there is no private key for anyone to hold, lose or
    # rotate -- and what it proves is stronger than a detached signature, which
    # says only that someone with the key made this. `contents` is repeated
    # because naming any permission at a job replaces the workflow's whole set.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Packaging tools, and the desktop libraries the desktop packages build against
        run: dnf install -y git rpm-build gcc cmake pkgconf-pkg-config gtk4-devel libadwaita-devel fuse3 desktop-file-utils appstream curl tar gzip qt6-qtbase-devel kf6-kio-devel kf6-ki18n-devel
      - name: Install pinned toolchain
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build all packages from HEAD
        env:
          CIRROVE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.CIRROVE_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            test -n "$CIRROVE_GOOGLE_DESKTOP_CLIENT_SECRET" || { echo 'missing Cirrove Google Desktop OAuth build input'; exit 1; }
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/build-rpm-package.sh
      # The packages are the artefact a release takes and a VM installs; every
      # push leaves a set to download.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/rpm/*.rpm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm-packages
          path: target/rpm/*.rpm
          if-no-files-found: error
      - name: Install, run, validate what a desktop would read, and remove
        run: |
          dnf install -y target/rpm/*.rpm
          cirrove --help >/dev/null
          cirroved --help >/dev/null
          grep -q '^ExecStart=/usr/bin/cirroved ' /usr/lib/systemd/user/cirroved.service
          desktop-file-validate /usr/share/applications/io.github.Dandiccf.Cirrove.desktop
          desktop-file-validate /etc/xdg/autostart/io.github.Dandiccf.Cirrove.Tray.desktop
          appstreamcli validate /usr/share/metainfo/io.github.Dandiccf.Cirrove.metainfo.xml
          test -f /usr/share/nautilus-python/extensions/cirrove.py
          test -f /usr/lib64/qt6/plugins/kf6/kfileitemaction/cirrovefileitemaction.so
          test -f /usr/lib64/qt6/plugins/kf6/overlayicon/cirroveoverlayicon.so
          dnf remove -y cirrove-dolphin cirrove-desktop cirrove
          for f in /usr/bin/cirroved /usr/bin/cirrove /usr/bin/cirrove-tray /usr/lib/systemd/user/cirroved.service /etc/xdg/autostart/io.github.Dandiccf.Cirrove.Tray.desktop; do
            ! test -e "$f" || { echo "$f survived removal"; exit 1; }
          done

  # Milestone 6, line 336: the daemon and CLI on a machine that has no desktop
  # at all. The deb and rpm jobs install onto runners where libgtk-4-dev and
  # libadwaita-dev were installed to build the desktop package, so they cannot
  # tell whether the core package needs a desktop library or merely found one.
  # This installs the core package alone into a clean container, asserts before
  # and after that nothing GTK or libadwaita is present, and then runs the
  # binaries -- which is the claim, rather than a grep of the Depends field.
  headless-package-install:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    needs: deb-package
    timeout-minutes: 20
    steps:
      - name: A container with a package manager and nothing else
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deb-packages
          path: pkgs
      - name: Nothing desktop is installed to begin with
        run: |
          if dpkg -l | grep -E 'libgtk-4|libadwaita'; then
            echo "the container already has a desktop library; this job proves nothing" >&2
            exit 1
          fi
          echo "clean: no libgtk-4, no libadwaita"
      - name: Install the core package alone
        # --no-install-recommends on purpose: the package recommends
        # gnome-keyring and xdg-utils, which are the conveniences a desktop
        # wants and a server does not, and pulling them in would be testing
        # apt's defaults rather than what the daemon requires. The claim under
        # test is the hard requirement.
        run: apt-get install -y --no-install-recommends ./pkgs/cirrove_*.deb
      - name: Still nothing desktop, after installing
        run: |
          if dpkg -l | grep -E 'libgtk-4|libadwaita'; then
            echo "installing the daemon pulled in a desktop library" >&2
            exit 1
          fi
          # The binaries must not merely be installed: they must link.
          ldd /usr/bin/cirroved | grep -E 'libgtk-4|libadwaita' && {
            echo "cirroved links a desktop library" >&2; exit 1; } || true
          ldd /usr/bin/cirrove | grep -E 'libgtk-4|libadwaita' && {
            echo "cirrove links a desktop library" >&2; exit 1; } || true
          echo "clean: the daemon and CLI carry no desktop library"
      - name: They run
        run: |
          cirrove --help >/dev/null
          cirroved --help >/dev/null
          cirrove --version
          grep -q '^ExecStart=/usr/bin/cirroved ' /usr/lib/systemd/user/cirroved.service
      - name: The hard dependency came in by being declared
        # fuse3 is not in the base container and nothing here names it, so if
        # it is present now, the Depends is what brought it. A mount without
        # fusermount3 fails at the moment a person first tries to use the
        # thing, which is the worst moment to discover a missing dependency.
        run: |
          dpkg-query -W fuse3 || { echo "fuse3 is not installed: the Depends did not bring it" >&2; exit 1; }
          command -v fusermount3 >/dev/null || { echo "fuse3 is installed but fusermount3 is not on PATH" >&2; exit 1; }
      - name: The desktop package is the one that needs a desktop
        run: |
          # Installing it here must either pull the libraries in or refuse --
          # what it must not do is install and leave a binary that cannot run.
          apt-get install -y ./pkgs/cirrove-desktop_*.deb
          dpkg -l | grep -qE 'libgtk-4' || {
            echo "the desktop package installed without a GTK runtime" >&2; exit 1; }
          ldd /usr/bin/cirrove-desktop | grep -q 'libgtk-4' || {
            echo "cirrove-desktop does not link GTK, which cannot be right" >&2; exit 1; }
          echo "the split is real: the daemon needs no desktop, the desktop package brings its own"
      - name: The desktop integration arrives with it
        # Recommends, not Depends, so this install (without
        # --no-install-recommends) is the one that should bring them. Files
        # badges and the tray are the two things a person notices missing, and
        # both come from a package the desktop package only recommends.
        run: |
          for p in python3-nautilus gnome-shell-extension-appindicator; do
            dpkg-query -W "$p" || { echo "$p is absent: the Recommends did not bring it" >&2; exit 1; }
          done
          test -e /usr/share/nautilus-python/extensions/cirrove.py
      - name: Remove, and leave nothing behind
        # Ask the filesystem rather than a list written by hand: the list is
        # how switch-to-package.sh came to leave eight icons, a desktop entry
        # and a metainfo file behind, because it only found what someone
        # remembered to write down.
        run: |
          apt-get purge -y cirrove-desktop cirrove
          left=$(find /usr /etc -iname '*cirrove*' -not -path '*/__pycache__/*' 2>/dev/null)
          if [ -n "$left" ]; then
            echo "these survived removal:" >&2; echo "$left" >&2; exit 1
          fi
          echo "nothing package-owned survived"

  # Milestone 6: the dependency review, run on every push rather than
  # remembered. cargo audit fails on any advisory that .cargo/audit.toml does
  # not ignore with a reason; the licence summary is the same one
  # docs/distribution.md reports, and fails on a licence outside the list of
  # permissive ones the binaries are distributed under.
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Advisories
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Licences
        run: python3 scripts/licence-check.py
