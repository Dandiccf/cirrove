# Fedora Workstation, installed without a hand on it, for the real-desktop
# checks in docs/distribution.md. Served to anaconda by scripts/vm/run.sh over
# the user-network gateway; the kernel is told inst.ks=http://10.0.2.2:8000/ks.cfg.
#
# A throwaway machine: the test account's password is the word "cirrove" so a
# person can log in at the console when something goes wrong.
text
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --hostname=cirrove-fedora --activate
rootpw --lock
user --name=tester --gecos="Cirrove Tester" --groups=wheel --iscrypted --password=$6$cirrovevmsalt$k3vOPAV.UIZDSi4XWbOdp3nx7ALftX.roHujQ2G37LcvPNK8EQJombJTCxwFOp3PxFiYNy6NdwFhxQzJV1X5G.
zerombr
clearpart --all --initlabel
autopart
bootloader
reboot

%packages
@^workstation-product-environment
fuse3
nautilus-python
gnome-shell-extension-appindicator
openssh-server
%end

%post
# Log the test user in at boot: the session is what is under test.
cat > /etc/gdm/custom.conf <<'EOF'
[daemon]
AutomaticLoginEnable=True
AutomaticLogin=tester
EOF
# Straight to the desktop, not the first-boot wizard.
systemctl disable gnome-initial-setup-first-login.service 2>/dev/null || true
mkdir -p /home/tester/.config
touch /home/tester/.config/gnome-initial-setup-done
chown -R tester:tester /home/tester/.config
# No password for sudo on the throwaway machine.
echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester
chmod 440 /etc/sudoers.d/tester
systemctl enable sshd
%end
