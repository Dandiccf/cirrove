[package]
name = "cirrove-allocator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
libc.workspace = true

# The workspace forbids unsafe code. Three glibc calls have no safe wrapper, so
# this crate is the one place it is allowed, and it is deliberately the smallest
# thing that can hold them: no state, no threads, no error paths of its own.
# `deny` rather than the workspace `forbid` so this file is the only exception,
# and it stays visible in review rather than becoming a workspace-wide relaxation.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
